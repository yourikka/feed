name: feed-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feed-flow-backend
    env:
      JWT_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Run backend tests
        run: go test ./...

  frontend-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feed-flow-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: feed-flow-frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./feed-flow-backend
            file: ./feed-flow-backend/Dockerfile
          - name: frontend
            context: ./feed-flow-frontend
            file: ./feed-flow-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          provenance: false

  integration-smoke:
    runs-on: ubuntu-latest
    needs:
      - docker-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare env
        run: |
          cp .env.example .env
          cat <<'EOF' >> .env
          MYSQL_ROOT_PASSWORD=root123
          MYSQL_DSN=root:root123@tcp(mysql:3306)/douyin?charset=utf8mb4&parseTime=True&loc=Local
          JWT_SECRET=0123456789abcdef0123456789abcdef
          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
          FEED_HOT_WINDOW_HOURS=24
          EOF
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/douyin/feed/?limit=1 >/dev/null 2>&1 && \
               curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "services failed to become ready"
          docker compose ps
          exit 1
      - name: Run smoke tests
        run: ./scripts/smoke.sh
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v

  publish-images:
    runs-on: ubuntu-latest
    needs:
      - integration-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./feed-flow-backend
            file: ./feed-flow-backend/Dockerfile
          - name: frontend
            context: ./feed-flow-frontend
            file: ./feed-flow-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/feed-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
